<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>云播直播间</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
    body { overflow: hidden; background: #000; }
    iframe { display: block; }
  </style>
</head>
<body>
  <iframe id="live-frame" title="直播间" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <script>
    (function () {
      var parts = location.pathname.replace(/\/+$/, '').split('/');
      var roomId = parts[parts.length - 1];

      if (!/^\d+$/.test(roomId)) {
        document.body.textContent = '直播间地址无效';
        document.body.style.cssText = 'margin:0;display:grid;place-items:center;background:#111;color:#fff;font:16px sans-serif';
        return;
      }

      document.getElementById('live-frame').src = 'https://qv.blogdd.cn/live/' + roomId;
    }());
  </script>
</body>
</html>
